    <fieldset>

        <legend>User Info</legend>

    

    <form action="./submitted.html" method="get">

        <label for="fullname">Fullname:</label>
        <input type="text" id="fullname"
        placeholder="Type your name" minlength="3"
        maxlength="16" required name="fullname"
        > <br><br>
        <label for="email">Email:</label>
        <input type="email" name="email" required
        placeholder="Type your Email" id="email"
        ><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password"
        placeholder="Type your password" name="password"
        minlength="8" required
        ><br><br>
        <label>Gender:</label>
        <input type="radio" name="gender"
        id="male" value="male"
        >
        <label for="male">Male</label>
        <input type="radio" name="gender"
        value="female" id="female"
        >
        <label for="female">Female</label><br><br>
        <label>Hobbies:</label>
        <input type="checkbox" name="hobbies"
        value="reading" id="reading"
        >
        <label for="reading">Reading</label>
 <input type="checkbox" name="hobbies"
        value="cooking" id="cooking"
        >
        <label for="cooking">cooking</label>

         <input type="checkbox" name="hobbies"
        value="Writing" id="Writing"
        >
        <label for="Writing">Writing</label>

         <input type="checkbox" name="hobbies"
        value="Coding" id="Coding"
        >
        <label for="Coding">Coding</label> <br><br>

        <select name="Countries">
            <option disabled selected>Select Your Country</option>
            <option value="Iran">Iran</option>
            <option value="Oman">Oman</option>
            <option value="Pakistan">Pakistan</option>
            <option value="China">China</option>
            <option value="Japan">Japan</option>
        </select> <br><br>

        <button type="submit">Submit</button>


    </form>


</fieldset>

</body>
</html>
